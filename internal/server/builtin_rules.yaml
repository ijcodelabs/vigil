# Rules every vigil server runs without being asked: what "it is down" means
# for the things vigil itself knows about. Shown under Alerts > Rules as the
# group "builtin" and served at /api/v1/rules/builtin.
#
# To change one, define an alert of the same name in the rule file; yours
# then runs instead. A group named "builtin" in the rule file replaces all
# of these (with `rules: []`, switches them off).
groups:
  - name: builtin
    interval: 30s
    rules:
      - alert: HostDown
        expr: vigil_agent_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 'Agent {{ $labels.agent }} stopped reporting'

      - alert: AgentDroppingData
        expr: increase(vigil_agent_dropped_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.agent }} is dropping data ({{ $labels.reason }})'

      - alert: ProbeFailing
        expr: probe_success == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.probe }} ({{ $labels.target }}) does not answer when checked from {{ $labels.agent }}'

      - alert: CertificateExpiresSoon
        expr: probe_tls_cert_expiry_seconds < 14 * 86400 and probe_tls_cert_expiry_seconds > 0
        labels: {severity: warning}
        annotations:
          summary: 'The certificate of {{ $labels.probe }} ({{ $labels.target }}) expires in {{ $value | humanizeDuration }}'

      - alert: CertificateExpired
        expr: probe_tls_cert_expiry_seconds <= 0
        labels: {severity: critical}
        annotations:
          summary: 'The certificate of {{ $labels.probe }} ({{ $labels.target }}) has expired'

      # The secret store set up under Settings > Secrets. While it does not
      # answer, vigil goes on with the values it read last.
      - alert: SecretStoreDown
        expr: vigil_secret_store_up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'vigil cannot reach its secret store (sealed, down or its login refused); it uses the values it read last'

      - alert: SecretStoreLoginExpiring
        expr: vigil_secret_store_token_expiry_seconds{renewable="false"} < 3 * 86400
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'vigil''s token for the secret store cannot be renewed and expires in {{ $value | humanizeDuration }}; give it a new one under Settings > Secrets'

      # A contact whose sends fail and none succeed: it is told through the
      # contacts that still work (Alerts > Contacts & routing shows the error).
      - alert: NotificationsFailing
        expr: |
          increase(vigil_notifications_total{result="failed"}[15m]) > 0
            unless on (receiver, integration, index) increase(vigil_notifications_total{result="ok"}[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: 'Notifications to {{ $labels.receiver }} ({{ $labels.integration }}) fail; see Alerts > Contacts & routing'

      # The scheduled check that posts nothing (delivery_checks) failed twice
      # in a row: a wrong token, a chat the bot left, an address that no
      # longer answers. Found before an alert has to go there.
      - alert: NotificationCheckFailing
        expr: vigil_notification_check{state="failing"} == 1
        for: 20m
        labels: {severity: warning}
        annotations:
          summary: 'The delivery check of {{ $labels.receiver }} ({{ $labels.integration }}) fails; see Alerts > Contacts & routing'
