title: Docker
description: Logs and CPU, memory and network usage of every container of the local Docker (or Podman) daemon.
detect:
  process: [dockerd]
params:
  socket:
    default: /var/run/docker.sock
    description: The daemon's API socket.
config:
  docker:
    enabled: true
    socket: "${socket}"
rules:
  - name: alerts
    interval: 1m
    rules:
      # Exit code 0 is a container that finished (a migration, a one-off
      # job) and stays quiet; a removed container is no longer reported.
      - alert: ContainerDown
        expr: container_exit_code != 0 and container_running == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Container {{ $labels.container }} on {{ $labels.agent }} is not running (exit code {{ $value }})'
      # A difference against the value 15 minutes ago, not increase(): the
      # store counts a counter it sees for the first time as having risen
      # from zero, which would report every old restart of a container as new.
      - alert: ContainerRestarting
        expr: container_restarts_total - container_restarts_total offset 15m > 3
        labels: {severity: warning}
        annotations:
          summary: 'Container {{ $labels.container }} on {{ $labels.agent }} was restarted {{ $value | humanize }} times in 15 minutes'
      - alert: ContainerMemoryNearLimit
        expr: container_memory_usage_bytes / (container_memory_limit_bytes > 0) > 0.9 and container_memory_limit_bytes < 1e15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Container {{ $labels.container }} on {{ $labels.agent }} uses {{ $value | humanizePercentage }} of its memory limit'
queries:
  - name: Containers using most memory
    query: topk(10, container_memory_usage_bytes)
  - name: CPU cores used per container
    query: rate(container_cpu_usage_seconds_total[5m])
  - name: Containers that are not running
    query: container_running == 0
  - name: Containers restarted in the last hour
    query: container_restarts_total - container_restarts_total offset 1h > 0
  - name: Which containers log most
    type: logs
    query: source:docker | stats by (agent, container) count() as lines | sort by (lines desc)
  - name: Error lines from containers
    type: logs
    query: source:docker (level:~"(?i)^(err|crit|fatal)" or error)
