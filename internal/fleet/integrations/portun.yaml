title: Portun
description: Portun's access requests, approvals and grants (its /metrics), the servers it knows from a tenant's export, its audit events over OTLP, and SSH logins on guarded hosts that did not come through Portun Jump. Follows Portun's observability contract v1.
detect:
  image: [portun-core, portun]
params:
  metrics_target:
    default: "localhost:3000"
    description: Address of Portun's own /metrics (health of the installation).
  metrics_token_file:
    default: /etc/vigil/portun-metrics-token
    description: File on this host with the token Portun's /metrics wants (PORTUN_METRICS_TOKEN). Read at every scrape.
  export_target:
    default: "localhost:3000"
    description: Address of Portun's tenant export, /api/export/v1/metrics. Switch the portun-export job off in a profile where there is none.
  export_scheme:
    default: http
    description: http, or https when the export is reached through an edge.
  export_token_file:
    default: /etc/vigil/portun-export-token
    description: 'File on this host with a tenant export token (bxp_…, from "portun admin jump export-token"). The token decides the tenant.'
  event_agents:
    default: ""
    description: 'Vigil agents whose OTLP endpoint receives Portun''s audit events, as a regular expression (gateway-1|portun-host). Events that arrive anywhere else are not trusted, and an alert says so. Empty: none yet.'
  emitters:
    default: ""
    description: 'Names of Portun''s emitters in those agents'' otlp.tokens_file, as a regular expression (portun-1|gw-euw1). The name comes from the token, so a sender cannot claim it.'
  tenant_ref:
    default: ""
    description: The tenant's tenant_ref (32 hex characters, shown with the export token). Events for another tenant raise an alert.
  guarded_agents:
    default: ""
    description: 'Vigil agents whose SSH logins must all come through Portun Jump, as a regular expression (web-prod-.*). They need the SSH logins integration. Empty: no host is guarded.'
  tenant_ca:
    default: ""
    description: 'Fingerprint of the tenant''s SSH user CA as sshd logs it, SHA256:… (ssh-keygen -lf ca.pub). A certificate login counts as a Portun Jump login only with this CA.'
config:
  # Portun's events name people by pseudonyms (actor_ref, approver_ref); vigil
  # keeps none. Portun's emitters should run with PORTUN_OTLP_PEOPLE=off for
  # vigil; this drops them anyway, whatever an emitter sends.
  otlp:
    logs:
      drop_attributes: {actor_ref: true, approver_ref: true}
  scrape:
    static:
      - job: portun
        targets: ["${metrics_target}"]
        path: /metrics
        bearer_token_file: "${metrics_token_file}"
      - job: portun-export
        targets: ["${export_target}"]
        scheme: "${export_scheme}"
        path: /api/export/v1/metrics
        bearer_token_file: "${export_token_file}"
        interval: 1m
rules:
  # Portun's own rule file (deploy/monitoring/portun-rules.yaml in Portun's
  # repository), under the same alert names: a rule file that carries
  # Portun's copy replaces these by name instead of doubling them.
  # Counters are compared with their value a while ago, not increase():
  # the store counts a counter it sees for the first time as having risen
  # from zero, so a gateway's old totals would alert on the first scrape.
  - name: alerts
    interval: 1m
    rules:
      - alert: PortunDown
        expr: up{job="portun"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Portun {{ $labels.instance }} is not answering scrapes'
      - alert: PortunShardUnreachable
        expr: portun_core_shards_unreachable > 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: '{{ $value }} data shard(s) unreachable from Portun'
      - alert: PortunJobsStalledFulfilment
        expr: portun_core_request_unfulfilled_oldest_seconds > 600
        labels: {severity: critical}
        annotations:
          summary: 'An approved request has waited over 10 minutes for access: is the jobs runner up?'
      - alert: PortunAccessOverdue
        expr: portun_core_access_overdue > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: '{{ $value }} grant(s) are past their end and not removed: is the jobs runner up?'
      - alert: PortunRevokeStuck
        expr: portun_core_grants_revoke_stuck > 0
        labels: {severity: critical}
        annotations:
          summary: 'Removing access failed on every retry for {{ $value }} grant(s): people may still have it'
      - alert: PortunOutboxBacklog
        expr: portun_core_outbox_oldest_seconds > 900
        labels: {severity: warning}
        annotations:
          summary: 'Slack follow-ups have not been delivered for over 15 minutes'
      - alert: PortunApprovalsWaiting
        expr: portun_core_request_pending_oldest_seconds > 4 * 3600
        labels: {severity: info}
        annotations:
          summary: 'A request has waited over 4 hours for a decision'
      - alert: PortunJumpRecordingProblems
        expr: sum(portun_core_jump_recordings_problem_24h{status=~"broken|tampered"}) > 0
        labels: {severity: warning}
        annotations:
          summary: 'Jump recordings ended broken or failed their checks in the last 24 h'
      - alert: PortunHttpErrors
        expr: sum(rate(portun_core_http_requests_total{code="5xx"}[5m])) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Portun is answering with server errors'
      # Vigil's own, from the contract.
      - alert: PortunSecretsStoreSealed
        expr: portun_core_openbao_sealed == 1
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Portun cannot use its secrets store (sealed or unreachable)'
      - alert: PortunExportDown
        expr: up{job="portun-export"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Portun''s tenant export at {{ $labels.instance }} is not answering (token, address or edge?)'
      - alert: PortunExportTruncated
        expr: portun_export_truncated == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Portun''s tenant export hit its limit of servers and left some out'
      - alert: PortunEventsDropped
        expr: sum by (job, instance) (portun_core_events_dropped_total - portun_core_events_dropped_total offset 15m) > 0
        labels: {severity: info}
        annotations:
          summary: 'Portun dropped {{ $value }} audit events on the way to monitoring in 15 minutes: Vigil''s copy has a gap (Portun''s own record has none)'
  - name: events
    type: logs
    interval: 1m
    rules:
      # A record that says it is Portun's audit but did not come in through a
      # pinned agent with a pinned emitter's token, or whose sender calls
      # itself something else (service.instance.id): forged, or a sender
      # nobody configured. The token names are Portun's emitter ids.
      - alert: PortunEventsFromUnknownSource
        expr: '_time:5m logger:="portun.audit" !(agent:~"^(${event_agents})$" emitter:~"^(${emitters})$" service_instance:~"^(${emitters})$") | stats by (agent, emitter, service_instance) count() as events'
        labels: {severity: warning}
        annotations:
          summary: '{{ $value }} Portun audit events reached {{ $labels.agent }} from {{ $labels.emitter }} (calling itself {{ $labels.service_instance }}), which is not a pinned source: not trusted'
      - alert: PortunEventsForAnotherTenant
        expr: '_time:5m logger:="portun.audit" agent:~"^(${event_agents})$" emitter:~"^(${emitters})$" tenant_ref:* !tenant_ref:="${tenant_ref}" | stats by (agent, emitter) count() as events'
        labels: {severity: warning}
        annotations:
          summary: '{{ $value }} Portun audit events from {{ $labels.emitter }} carry a tenant_ref other than the integration''s (is tenant_ref set?)'
      - alert: PortunBreakGlassUsed
        expr: '_time:5m logger:="portun.audit" agent:~"^(${event_agents})$" emitter:~"^(${emitters})$" event_name:="portun.break_glass.used" | stats by (resource) count() as uses'
        labels: {severity: warning}
        annotations:
          summary: 'Break-glass access was used in Portun (resource {{ $labels.resource }})'
  - name: shadow_access
    type: logs
    interval: 1m
    rules:
      # A login to a guarded host is a Portun Jump login only when all three
      # hold: a certificate, the contract's Key ID, and the tenant's CA as
      # the last field of sshd's line (the sshd integration takes it from
      # there). The unit is checked here again: only sshd writes under its
      # own unit, and an Accepted line the template could not take apart
      # counts as not Jump: it fails closed. Best effort; what this cannot
      # see is in the docs.
      - alert: SshLoginNotThroughPortunJump
        expr: '_time:5m unit:~"^sshd?(@.+)?[.]service$" _msg:~"^Accepted " agent:~"^(${guarded_agents})$" !(ssh_key_type:~"-CERT$" ssh_key_id:~"^portun-jump:v1:(?:[0-9a-f]{32}|masked):[0-9a-f-]{36}:[0-9a-f-]{36}$" ssh_ca_fp:="${tenant_ca}") | stats by (agent, ssh_user, ssh_from, ssh_method) count() as logins'
        labels: {severity: critical}
        annotations:
          summary: 'SSH login to {{ $labels.agent }} as {{ $labels.ssh_user }} from {{ $labels.ssh_from }} ({{ $labels.ssh_method }}) did not come through Portun Jump'
dashboard:
  title: Portun
  variables:
    - {name: hostgroup, label: hostgroup, match: portun_jump_inventory_agent_info}
  panels:
    - {title: Portun up, type: stat, w: 2, h: 2, unit: yesno, queries: [{expr: 'min(up{job="portun"})'}]}
    - {title: Requests waiting, type: stat, w: 2, h: 2, queries: [{expr: 'sum(portun_core_requests_open)'}]}
    - {title: Oldest waiting, type: stat, w: 2, h: 2, unit: seconds, warn: 3600, crit: 14400, queries: [{expr: 'max(portun_core_request_pending_oldest_seconds)'}]}
    - {title: Access overdue, type: stat, w: 2, h: 2, warn: 1, queries: [{expr: 'sum(portun_core_access_overdue)'}]}
    - {title: Live sessions, type: stat, w: 2, h: 2, queries: [{expr: 'sum(portun_core_jump_sessions_live)'}]}
    - {title: Secrets store sealed, type: stat, w: 2, h: 2, unit: yesno, warn: 1, queries: [{expr: 'max(portun_core_openbao_sealed)'}]}
    - {title: Servers connected, type: stat, w: 2, h: 2, queries: [{expr: 'sum(portun_jump_agent_connected * on (exported_agent) group_left (hostgroup) portun_jump_inventory_agent_info{hostgroup=~"$hostgroup"})'}]}
    - {title: Servers offline, type: stat, w: 2, h: 2, warn: 1, queries: [{expr: 'count((portun_jump_agent_connected * on (exported_agent) group_left (hostgroup) portun_jump_inventory_agent_info{hostgroup=~"$hostgroup"}) == 0) or vector(0)'}]}
    - {title: Active grants, type: stat, w: 2, h: 2, queries: [{expr: 'sum(portun_jump_grants_active{hostgroup=~"$hostgroup"})'}]}
    - {title: Outbox lag, type: stat, w: 2, h: 2, unit: seconds, warn: 900, queries: [{expr: 'max(portun_core_outbox_oldest_seconds)'}]}
    - {title: Events dropped (range), type: stat, w: 2, h: 2, warn: 1, queries: [{expr: '(sum(portun_core_events_dropped_total - portun_core_events_dropped_total offset $__range) or vector(0)) + (sum(portun_jump_events_dropped_total - portun_jump_events_dropped_total offset $__range) or vector(0))'}]}
    - {title: Logins without a Jump Key ID (range), type: stat, source: logs, w: 2, h: 2, warn: 1, queries: [{expr: 'unit:~"^sshd?(@.+)?[.]service$" ssh_result:=Accepted !ssh_key_id:~"^portun-jump:v1:" | stats count() as logins'}]}
    # Admins only in this version. Nodes: Portun, its gateways, the agents
    # (grouped by host group) and what they reach; colour from the node's
    # value and its details. Links: who reaches whom, and the sessions open
    # now, which move.
    - title: Map
      type: map
      w: 12
      h: 6
      columns: [hostname, hostgroup, gateway, tag_env, tag_region, tag_team, version, os, kind, host_id, cluster_id]
      queries:
        - {expr: 'label_replace(up{job="portun"}, "control", "Portun", "", "")', node: control, tier: Portun, warn: 0.5, crit: 0}
        - {expr: 'portun_jump_inventory_gateway_info', node: gateway, tier: Gateways}
        - {expr: 'portun_jump_agent_connected * on (exported_agent) group_left (hostgroup, hostname, gateway, os, tag_env, tag_region, tag_team, version) portun_jump_inventory_agent_info{hostgroup=~"$hostgroup"}', node: exported_agent, name: hostname, group: hostgroup, tier: Agents, warn: 0.5, crit: 0}
        - {expr: 'portun_jump_resource_info', node: resource, group: kind, tier: Resources}
        - {expr: 'label_replace(portun_jump_inventory_gateway_info, "control", "Portun", "", "")', from: control, to: gateway}
        - {expr: 'portun_jump_agent_connected * on (exported_agent) group_left (gateway) portun_jump_inventory_agent_info', from: gateway, to: exported_agent}
        - {expr: 'portun_jump_resource_info', from: exported_agent, to: resource}
        - {expr: 'sum by (exported_agent, resource) (portun_jump_agent_streams_open)', from: exported_agent, to: resource, live: true}
        - {expr: 'label_replace(sum(portun_core_requests_open), "control", "Portun", "", "")', of: control, legend: Requests waiting}
        - {expr: 'label_replace(max(portun_core_outbox_oldest_seconds), "control", "Portun", "", "")', of: control, legend: Outbox lag, unit: seconds, warn: 900}
        - {expr: 'label_replace(max(portun_core_openbao_sealed), "control", "Portun", "", "")', of: control, legend: Secrets store sealed, unit: yesno, crit: 1}
        - {expr: '100 * portun_jump_spool_bytes / portun_jump_spool_limit_bytes * on (instance) group_left (gateway) portun_jump_gateway_info', of: gateway, legend: Spool used, unit: percent, warn: 80, crit: 95}
        - {expr: 'portun_jump_agent_cert_expiry_timestamp_seconds - time()', of: exported_agent, legend: Certificate left, unit: seconds, warn: 604800, crit: 172800}
        - {expr: 'time() - portun_jump_agent_last_seen_timestamp_seconds', of: exported_agent, legend: Last seen, unit: seconds}
    - title: Servers Portun Jump knows
      type: table
      w: 12
      h: 4
      columns: [hostgroup, exported_agent, hostname, gateway, tag_env, tag_region, tag_team, version]
      queries:
        - {expr: 'portun_jump_agent_connected * on (exported_agent) group_left (hostgroup, hostname, gateway, tag_env, tag_region, tag_team, version) portun_jump_inventory_agent_info{hostgroup=~"$hostgroup"}', legend: Connected, unit: yesno, warn: 0.5, crit: 0}
        - {expr: '(time() - portun_jump_agent_last_seen_timestamp_seconds) * on (exported_agent) group_left (hostgroup, hostname, gateway, tag_env, tag_region, tag_team, version) portun_jump_inventory_agent_info{hostgroup=~"$hostgroup"}', legend: Last seen, unit: seconds, warn: 300, crit: 3600}
    - title: Resources
      type: table
      w: 6
      h: 4
      columns: [resource, kind, exported_agent, host_id]
      queries: [{expr: 'portun_jump_resource_info', legend: Known}]
    - title: Requests waiting by status
      type: timeseries
      w: 6
      h: 3
      min: 0
      queries: [{expr: 'sum by (status) (portun_core_requests_open)', legend: '{{status}}'}]
    - title: Time to a decision (90th percentile)
      type: timeseries
      w: 6
      h: 3
      unit: seconds
      min: 0
      queries: [{expr: 'histogram_quantile(0.9, sum by (decision, le) (rate(portun_core_request_decision_wait_seconds_bucket[1h])))', legend: '{{decision}}'}]
    - title: Portun HTTP responses by class
      type: timeseries
      w: 6
      h: 3
      unit: ops/s
      min: 0
      queries: [{expr: 'sum by (code) (rate(portun_core_http_requests_total[5m]))', legend: '{{code}}'}]
    - title: Open streams by protocol
      type: timeseries
      w: 6
      h: 3
      min: 0
      queries: [{expr: 'sum by (protocol) (portun_jump_agent_streams_open)', legend: '{{protocol}}'}]
    - title: Audit events by name (range, as received)
      type: table
      source: logs
      w: 6
      h: 4
      queries: [{expr: 'logger:="portun.audit" | stats by (event_name, outcome, emitter) count() as events | sort by (events desc) | limit 30'}]
    - title: SSH logins without a Portun Jump Key ID (any host; the alert checks the CA and guarded hosts)
      type: table
      source: logs
      w: 6
      h: 4
      queries: [{expr: 'unit:~"^sshd?(@.+)?[.]service$" ssh_result:=Accepted !ssh_key_id:~"^portun-jump:v1:" | stats by (agent, ssh_user, ssh_from, ssh_method) count() as logins | sort by (logins desc) | limit 30'}]
    - {title: Latest audit events (as received; Portun is the record), type: logs, w: 12, h: 4, limit: 50, queries: [{expr: 'logger:="portun.audit"'}]}
queries:
  - name: Portun audit events by name
    type: logs
    query: 'logger:="portun.audit" | stats by (event_name, outcome) count() as events | sort by (events desc)'
  - name: Portun Jump sessions started
    type: logs
    query: 'logger:="portun.audit" event_name:="portun.session.started"'
  - name: Portun servers offline
    query: portun_jump_agent_connected == 0
