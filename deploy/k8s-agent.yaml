# vigil agent as a DaemonSet: host metrics of every node, metrics of the pods
# on it that carry prometheus.io/scrape: "true", and the logs of all its pods.
# Create the secret first. With an enrolment token (Fleet > Enrolment), every
# node exchanges it for a token of its own and keeps that on the node:
#   kubectl -n vigil create secret generic vigil-agent \
#     --from-literal=enroll-token=vge_... --from-literal=ca-pin=sha256:...
# (ca-pin only if the server uses its own certificate authority), or with the
# server's shared ingest token:
#   kubectl -n vigil create secret generic vigil-agent --from-literal=token=...
apiVersion: v1
kind: Namespace
metadata: {name: vigil}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: vigil-agent, namespace: vigil}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: vigil-agent}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  # Per-container usage is read from each node's kubelet.
  - apiGroups: [""]
    resources: [nodes/metrics, nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: vigil-agent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: vigil-agent}
subjects:
  - {kind: ServiceAccount, name: vigil-agent, namespace: vigil}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: vigil-agent, namespace: vigil}
data:
  agent.yaml: |
    server:
      url: https://vigil.example.internal:8080
      # Whichever the secret holds; the others stay empty.
      token: ${VIGIL_INGEST_TOKEN}
      enroll_token: ${VIGIL_ENROLL_TOKEN}
      ca_pin: ${VIGIL_CA_PIN}
    agent_id: ${NODE_NAME}
    spool_dir: /var/lib/vigil/spool
    # Labels say what this is; the server's profiles select agents by them.
    # Every agent on Kubernetes also reports the fact kubernetes="true".
    labels:
      cluster: my-cluster
    # What follows applies until a profile on the server matches this agent;
    # configs/profiles/kubernetes.yaml is the same thing as a profile.
    scrape:
      kubernetes:
        enabled: true
      kubelet:
        enabled: true
    logs:
      kubernetes:
        enabled: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: vigil-agent, namespace: vigil}
spec:
  selector:
    matchLabels: {app: vigil-agent}
  template:
    metadata:
      labels: {app: vigil-agent}
    spec:
      serviceAccountName: vigil-agent
      hostNetwork: true          # network counters of the node, not of the pod
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: vigil:dev       # replace with your registry/image
          args: ["agent", "-config", "/etc/vigil/agent.yaml"]
          # Root for the pod log files. Privileged is only needed for runtime
          # events (security.enabled); without them, drop it.
          securityContext: {runAsUser: 0, privileged: true}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: VIGIL_INGEST_TOKEN
              valueFrom: {secretKeyRef: {name: vigil-agent, key: token, optional: true}}
            - name: VIGIL_ENROLL_TOKEN
              valueFrom: {secretKeyRef: {name: vigil-agent, key: enroll-token, optional: true}}
            - name: VIGIL_CA_PIN
              valueFrom: {secretKeyRef: {name: vigil-agent, key: ca-pin, optional: true}}
            - {name: HOST_PROC, value: /host/proc}
            - {name: HOST_SYS, value: /host/sys}
            - {name: HOST_ETC, value: /host/etc}
            - {name: HOST_ROOT, value: /host/root}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/vigil}
            - {name: spool, mountPath: /var/lib/vigil}
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: etc, mountPath: /host/etc, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true}
            - {name: podlogs, mountPath: /var/log/pods, readOnly: true}
      volumes:
        - name: config
          configMap: {name: vigil-agent}
        - name: spool
          hostPath: {path: /var/lib/vigil, type: DirectoryOrCreate}
        - name: proc
          hostPath: {path: /proc}
        - name: sys
          hostPath: {path: /sys}
        - name: etc
          hostPath: {path: /etc}
        - name: root
          hostPath: {path: /}
        - name: podlogs
          hostPath: {path: /var/log/pods}
