# Central node: vigil server + VictoriaMetrics + VictoriaLogs + VictoriaTraces.
# Set VIGIL_INGEST_TOKEN and VIGIL_ADMIN_TOKEN in a .env file next to this one.
services:
  vigil:
    build: {context: .., target: server}
    command: ["-config", "/etc/vigil/server.yaml"]
    environment:
      VIGIL_INGEST_TOKEN: ${VIGIL_INGEST_TOKEN:?set VIGIL_INGEST_TOKEN}
      VIGIL_ADMIN_TOKEN: ${VIGIL_ADMIN_TOKEN:?set VIGIL_ADMIN_TOKEN}
    volumes:
      - ../configs/server.example.yaml:/etc/vigil/server.yaml:ro
      - vigil:/var/lib/vigil
    ports: ["8080:8080"]
    depends_on: [victoriametrics, victorialogs, victoriatraces]
    restart: unless-stopped

  # Storage is reachable only on the compose network; all access goes through vigil.
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    command: ["-storageDataPath=/storage", "-retentionPeriod=30d"]
    volumes: ["vm:/storage"]
    restart: unless-stopped

  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    command: ["-storageDataPath=/vlogs", "-retentionPeriod=14d"]
    volumes: ["vlogs:/vlogs"]
    restart: unless-stopped

  victoriatraces:
    image: docker.io/victoriametrics/victoria-traces:v0.12.1@sha256:609abddf298c9642496045296f30a3968b5a4b79b678373e2e7ef29c844f5578
    command: ["-storageDataPath=/vtraces", "-retentionPeriod=7d"]
    volumes: ["vtraces:/vtraces"]
    restart: unless-stopped

volumes:
  vigil:
  vm:
  vlogs:
  vtraces:
