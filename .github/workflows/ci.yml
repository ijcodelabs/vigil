name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not formatted:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Test
        run: make test
      # The static binaries people install, for both architectures.
      - name: Build
        run: make linux
