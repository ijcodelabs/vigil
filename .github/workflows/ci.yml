name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not formatted:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Test
        run: make test
      # The static binaries people install, for both architectures.
      - name: Build
        run: make linux

  # Keys, tokens and passwords must never be committed. The whole history is
  # scanned, so one that was added and removed again is found too.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e 'GIT_CONFIG_VALUE_0=*' \
            ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
